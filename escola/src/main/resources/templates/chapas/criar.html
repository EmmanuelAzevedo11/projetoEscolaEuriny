<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de chapa</title>
    <link rel="stylesheet" th:href="@{/css/criar.css}">
</head>
<body>
    <header>
        <nav>
            <a th:href="@{/paginaInicial}">Menu</a>
            <a th:href="@{/chapas}">Editar Chapa / Gerenciar</a>
            <a th:href="@{/votar}">Votar</a>
        </nav>
    </header>
    <main>
        <div id="botao_div">
            <h2>Cadastrar Nova Chapa</h2>
            <p>Os membros da chapa poderão ser atribuídos na próxima etapa.</p>
        </div>
        <div id="modalChapa" class="modal ativo" style="display:block; position:relative; z-index:1; background:transparent;">
            <div class="modal-conteudo">
                <h1>Criar Chapa</h1>
                <form id="formChapa" th:action="@{/chapas/salvar}" th:object="${chapa}" method="post">
                    <h2>Informações da Chapa</h2>

                    <label for="nomeChapa">Nome da chapa:</label>
                    <input type="text" id="nomeChapa" th:field="*{name}" required>

                    <label for="numero">Numero da chapa:</label>
                    <input type="number" id="numero" th:field="*{number}" min="1" step="1" required>

                    <label for="descricao">Descrição / Slogan:</label>
                    <input type="text" id="descricao" th:field="*{description}" required>

                    <label for="objetivos">Objetivos da chapa:</label>
                    <textarea id="objetivos" th:field="*{objective}" required></textarea>

                    <button type="submit" id="salvarChapa">
                        Criar Chapa e Adicionar Membros
                    </button>
                </form>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
