<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar chapa</title>
    <link rel="stylesheet" th:href="@{/css/gerenciar.css}">
    <style>
        .chapa-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            background: #fff;
        }
        .chapa-actions a {
            display: inline-block;
            margin-right: 10px;
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .chapa-actions a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a th:href="@{/paginaInicial}">Menu</a>
            <a th:href="@{/chapas/criar}">Criar Chapa</a>
            <a th:href="@{/votar}">Votar</a>
        </nav>
    </header>
    <main>
        <h1 id="titulo">Gerenciamento de chapa</h1>
        
        <div th:if="${mensagemSucesso}" class="alert alert-success" style="color: green;" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" style="color: red;" th:text="${mensagemErro}"></div>

        <div id="listaChapas">
            <div th:each="chapa : ${chapas}" class="chapa-card">
                <h2 th:text="${chapa.name}">Nome da Chapa</h2>
                <p>Chapa número <span th:text="${chapa.number}">0</span></p>
                <div class="chapa-actions">
                    <a th:href="@{/chapas/{id}(id=${chapa.id})}">Editar Dados</a>
                    <a th:href="@{/chapas/{id}/membros(id=${chapa.id})}">Gerenciar Membros</a>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(chapas)}">
                <p>Nenhuma chapa cadastrada.</p>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
